# FlightInfo CI - Version 2.0
# Runs the JVM tests and publishes one installable APK (debug-signed):
#  - as a workflow artifact on every push
#  - as a GitHub Release tagged v<versionName> on every push to main, with a
#    fixed asset name FlightInfo.apk so the latest build always has the same URL
#    (.../releases/latest/download/FlightInfo.apk) and Obtainium can track it.
name: build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the GitHub web interface lose the execute bit.
      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Assemble
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/FlightInfo-$VER.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/FlightInfo.apk"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: FlightInfo-apk
          path: dist/*.apk

      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: FlightInfo ${{ env.VER }}
          overwrite_files: true
          files: dist/*.apk
