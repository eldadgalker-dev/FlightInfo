# FlightInfo - aerial imagery pack builder - Version 1.0
# Manual workflow: downloads a NASA Blue Marble equirectangular image (public
# domain), reprojects it to Web Mercator tiles and publishes the MBTiles file
# to the GitHub Release "data-v1", where the app downloads it from.
# The default source URL is the 21600x10800 Blue Marble Next Generation with
# topography and bathymetry (August); adjust the input if NASA moves the file.
name: bluemarble

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Equirectangular Blue Marble image URL"
        required: true
        default: "https://eoimages.gsfc.nasa.gov/images/imagerecords/73000/73776/world.topo.bathy.200408.3x21600x10800.png"
      max_zoom:
        description: "Maximum zoom level (6 for 21600 px source, 7 for 43200 px)"
        required: true
        default: "6"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow numpy

      - name: Download source image
        run: curl -L --fail --retry 3 -o bluemarble_src "${{ github.event.inputs.source_url }}" && ls -la bluemarble_src

      - name: Build MBTiles
        run: python tools/build_bluemarble.py bluemarble_src "bluemarble_z0-${{ github.event.inputs.max_zoom }}.mbtiles" "${{ github.event.inputs.max_zoom }}"

      - name: Publish to release data-v1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-v1
          name: "Data packs"
          body: "Optional data packs downloaded by the app. bluemarble_z0-6.mbtiles: NASA Blue Marble Next Generation (public domain), Web Mercator, zoom 0-6."
          overwrite_files: true
          files: "*.mbtiles"
