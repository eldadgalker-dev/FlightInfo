# FlightInfo - aerial imagery pack builder - Version 2.0
# Manual workflow. Default mode "gibs" fetches ready-made Web Mercator tiles of
# NASA Blue Marble (public domain) from NASA GIBS (WMTS) and packs them into
# MBTiles. Mode "image" reprojects an equirectangular source image instead
# (NASA's image server was found to refuse connections from Actions runners).
# The result is attached to the GitHub Release "data-v1".
name: bluemarble

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "gibs (fetch tiles from NASA GIBS) or image (reproject a source image URL)"
        required: true
        default: "gibs"
      layer:
        description: "GIBS layer (gibs mode): BlueMarble_ShadedRelief_Bathymetry, BlueMarble_NextGeneration, BlueMarble_ShadedRelief"
        required: false
        default: "BlueMarble_ShadedRelief_Bathymetry"
      source_url:
        description: "Equirectangular image URL (image mode only)"
        required: false
        default: ""
      max_zoom:
        description: "Maximum zoom level (6 recommended: ~5,500 tiles, ~60-80 MB)"
        required: true
        default: "6"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build from GIBS tiles
        if: github.event.inputs.mode == 'gibs'
        run: python tools/build_bluemarble_gibs.py "bluemarble_z0-${{ github.event.inputs.max_zoom }}.mbtiles" "${{ github.event.inputs.max_zoom }}" "${{ github.event.inputs.layer }}"

      - name: Build from source image
        if: github.event.inputs.mode == 'image'
        run: |
          pip install pillow numpy
          curl -L --fail --retry 3 --connect-timeout 30 -o bluemarble_src "${{ github.event.inputs.source_url }}"
          python tools/build_bluemarble.py bluemarble_src "bluemarble_z0-${{ github.event.inputs.max_zoom }}.mbtiles" "${{ github.event.inputs.max_zoom }}"

      - name: Sanity check
        run: |
          ls -la *.mbtiles
          python - <<'PY'
          import glob, sqlite3
          for f in glob.glob("*.mbtiles"):
              c = sqlite3.connect(f)
              print(f, c.execute("select zoom_level, count(*) from tiles group by 1").fetchall())
          PY

      - name: Publish to release data-v1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-v1
          name: "Data packs"
          body: "Optional data packs downloaded by the app. bluemarble_z0-6.mbtiles: NASA Blue Marble (public domain), Web Mercator, zoom 0-6."
          overwrite_files: true
          files: "*.mbtiles"
